[project]
name = "abstract-searcher"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "ics>=0.7",
    "rapidfuzz>=3.0",
    "openpyxl>=3.0",
    "PySide6>=6.6",
]

[project.scripts]
abstract-searcher = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "desktop*"]
